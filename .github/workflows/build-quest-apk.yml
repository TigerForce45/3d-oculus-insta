name: Build Quest External Camera APK

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    # Явно фиксируем стабильную ОС, где гарантированно развернуты все SDK
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Install NDK and CMake
      run: |
        sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

    - name: Configure Environment Variables
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> $GITHUB_ENV
        echo "OCEAN_THIRDPARTY_PATH=$GITHUB_WORKSPACE/thirdparty/install" >> $GITHUB_ENV

    - name: Build APK with Gradle
      run: |
        cd build/gradle/application/ocean/demo/media/externalcamera/android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: quest-external-camera-apk
        path: build/gradle/application/ocean/demo/media/externalcamera/android/app/build/outputs/apk/debug/app-debug.apk
